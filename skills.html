<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills UI</title>
  <style>
    body {
      background: linear-gradient(135deg, #eaf6fb 0%, #d4f1f9 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 24px;
    }
    .section {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      margin-bottom: 40px;
      padding: 32px 24px 24px 24px;
    }
    .section-title {
      font-size: 2rem;
      color: #4682b4;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: flex-start;
    }
    .skill-card {
      background: #f8fbfd;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 32px 24px 20px 24px;
      min-width: 180px;
      text-align: center;
      transition: box-shadow 0.2s, transform 0.2s;
      flex: 1 1 180px;
      max-width: 220px;
      cursor: pointer;
    }
    .skill-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      transform: translateY(-4px) scale(1.03);
    }
    .skill-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 48px;
    }
    .skill-label {
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: #2d3a4a;
    }
    /* Responsive */
    @media (max-width: 900px) {
      .skills-grid {
        gap: 18px;
      }
      .skill-card {
        min-width: 140px;
        padding: 24px 12px 16px 12px;
      }
    }
    @media (max-width: 600px) {
      .container {
        padding: 8px;
      }
      .section {
        padding: 16px 6px 12px 6px;
      }
      .skills-grid {
        flex-direction: column;
        gap: 12px;
      }
      .skill-card {
        min-width: unset;
        max-width: unset;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="section">
      <div class="section-title">
        <span>💻</span> Languages &amp; Frameworks
      </div>
      <div class="skills-grid">
        <div class="skill-card">
          <div class="skill-icon">🌐</div>
          <div class="skill-label">PHP</div>
        </div>
        <div class="skill-card">
          <div class="skill-icon">🗄️</div>
          <div class="skill-label">MYSQL</div>
        </div>
        <div class="skill-card">
          <div class="skill-icon" style="color: #f7df1e;">JS</div>
          <div class="skill-label">JAVASCRIPT</div>
        </div>
        <div class="skill-card">
          <div class="skill-icon" style="color: #61dafb;">&lt;/&gt;</div>
          <div class="skill-label">REACT</div>
        </div>
        <div class="skill-card">
          <div class="skill-icon" style="color: #e44d26;">HTML</div>
          <div class="skill-label">HTML5</div>
        </div>
        <div class="skill-card">
          <div class="skill-icon" style="color: #2965f1;">CSS</div>
          <div class="skill-label">CSS3</div>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">
        <span>☁️</span> Cloud &amp; DevOps
      </div>
      <div class="skills-grid">
        <div class="skill-card">
          <div class="skill-icon" style="color: #f34f29;">&#128187;</div>
          <div class="skill-label">GIT</div>
        </div>
        <div class="skill-card">
          <div class="skill-icon" style="color: #24292e;">&#128187;</div>
          <div class="skill-label">GITHUB ACTIONS</div>
        </div>
        <div class="skill-card">
          <div class="skill-icon" style="color: #2496ed;">&#128187;</div>
          <div class="skill-label">DOCKER</div>
        </div>
        <div class="skill-card">
          <div class="skill-icon" style="color: #007fff;">&#9729;&#65039;</div>
          <div class="skill-label">AZURE</div>
        </div>
        <div class="skill-card">
          <div class="skill-icon" style="color: #ff9900;">&#9729;&#65039;</div>
          <div class="skill-label">AWS</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
